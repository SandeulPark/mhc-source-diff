###########################################################
#                 Exafe E2E Error message                 #
###########################################################

# Crypto
1001 = Hex encoded public key is not exist.
1002 = PublicKey Object is not exist.
1003 = Hex encoded secret key is not exist.
1004 = Encrypted secret key is not exist.
1005 = Certificate file path is wrong.(null or '')
1006 = X509Certificate Object is not exist.
1007 = PrivateKey file path is wrong.(null or '')
1008 = PrivateKey password is wrong.(null or '').
1009 = PrivateKey Object is not exist.

# Message
1101 = Message is not exist.
1102 = Encrypted message is not exist.
1103 = Decrypted message is not exist.
1104 = E2E formated message is not exist.
1105 = Server returned message is not exist.
1106 = Input message is not E2E formated.

# Etc
1201 = Charset info is not exist.
1202 = URL info is not exist.
1203 = Hex encoded string is not exist.
1204 = Byte array is not exist.

# License
1301 = License code check failed.
1302 = License validity has expired.
1303 = License validity value is wrong format.
